        apply(addHostMessageListener, nextHostPort, [

&lt;div id=&quot;tf-kansai-coverage&quot;&gt;
  &lt;style&gt;
    #tf-kansai-coverage { color: var(--foreground); }
    #tf-kansai-coverage .coverage-meta { display: flex; flex-wrap: wrap; gap: .3rem 1rem; margin: .6rem 0; }
    #tf-kansai-coverage .coverage-legend { display: flex; flex-wrap: wrap; gap: .5rem 1rem; margin: .5rem 0; }
    #tf-kansai-coverage .coverage-legend span { display: inline-flex; align-items: center; gap: .4rem; }
    #tf-kansai-coverage .coverage-legend i { display: inline-block; width: 1.4rem; height: 0; }
    #tf-kansai-coverage .legend-new { border-top: 2px solid var(--viz-series-1); }
    #tf-kansai-coverage .legend-starter { border-top: 2px dashed var(--viz-series-2); }
    #tf-kansai-coverage .legend-old { border-top: 2px dotted var(--viz-series-3); }
    #tf-kansai-coverage .legend-old-rectangle { border-top: 2px dashed var(--viz-series-5); }
    #tf-kansai-coverage .legend-rail { border-top: 2px solid var(--foreground); }
    #tf-kansai-coverage .map-holder { width: 100%; }
    #tf-kansai-coverage .coverage-map { display: block; width: 100%; overflow: hidden; }
    #tf-kansai-coverage .coverage-map text { fill: var(--foreground); font-size: 12px; font-weight: 400; }
    #tf-kansai-coverage .map-label { paint-order: stroke; stroke: var(--background); stroke-width: 3px; stroke-linejoin: round; }
    #tf-kansai-coverage .coverage-caption { margin-top: .45rem; }
    #tf-kansai-coverage .advanced-note { margin-top: .4rem; }
    #tf-kansai-coverage [hidden] { display: none; }
    #tf-kansai-coverage .coverage-legend span[hidden] { display: none; }
  &lt;/style&gt;
  &lt;h3&gt;1:1 新快速地圖：斜向範圍與 RAM 估算&lt;/h3&gt;
  &lt;div class=&quot;viz-controls&quot;&gt;
    &lt;label class=&quot;form-label&quot; for=&quot;tf-coverage-size&quot;&gt;遊戲地圖尺寸
      &lt;select id=&quot;tf-coverage-size&quot; class=&quot;form-select&quot;&gt;
        &lt;option value=&quot;friend-112-ratio-1-2&quot; selected&gt;112 級 · 1:2 斜長方形 · 敦賀至姬路&lt;/option&gt;
        &lt;option value=&quot;full-128-ratio-1-2&quot;&gt;128 級 · 1:2 斜長方形 · 包埋播州赤穗／上郡&lt;/option&gt;
        &lt;option value=&quot;full-attempt-112&quot;&gt;對照：112 級嘗試全部西端 · 覆蓋不足&lt;/option&gt;
      &lt;/select&gt;
    &lt;/label&gt;
  &lt;/div&gt;
  &lt;div class=&quot;coverage-meta tabular-nums&quot; aria-live=&quot;polite&quot;&gt;
    &lt;span id=&quot;tf-coverage-dimensions&quot;&gt;&lt;/span&gt;
    &lt;span id=&quot;tf-coverage-real&quot;&gt;&lt;/span&gt;
    &lt;span id=&quot;tf-coverage-angle&quot;&gt;&lt;/span&gt;
    &lt;span id=&quot;tf-coverage-ram&quot;&gt;&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;text-small&quot; id=&quot;tf-rectangle-note&quot;&gt;遊戲內 1 km＝現實 1 km。112／128 係選單尺寸級別；1:2 會按相近面積轉成長方形。&lt;/div&gt;
  &lt;div class=&quot;text-small&quot; id=&quot;tf-route-coverage&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;coverage-legend text-small&quot; aria-label=&quot;範圍框圖例&quot;&gt;
    &lt;span&gt;&lt;i class=&quot;legend-new&quot;&gt;&lt;/i&gt;&lt;span id=&quot;tf-coverage-new-name&quot;&gt;所選新圖&lt;/span&gt;&lt;/span&gt;
    &lt;span id=&quot;tf-starter-legend&quot;&gt;&lt;i class=&quot;legend-starter&quot;&gt;&lt;/i&gt;112 級 · 至姬路方案&lt;/span&gt;
    &lt;span&gt;&lt;i class=&quot;legend-old&quot;&gt;&lt;/i&gt;舊正方形（非 1:1）&lt;/span&gt;
    &lt;span&gt;&lt;i class=&quot;legend-old-rectangle&quot;&gt;&lt;/i&gt;舊斜長方形（非 1:1）&lt;/span&gt;
    &lt;span&gt;&lt;i class=&quot;legend-rail&quot;&gt;&lt;/i&gt;JR 新快速走廊參考線&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;map-holder&quot;&gt;
    &lt;svg class=&quot;coverage-map&quot; role=&quot;img&quot; aria-labelledby=&quot;tf-map-title tf-map-desc&quot;&gt;
      &lt;title id=&quot;tf-map-title&quot;&gt;真正 1:1 的敦賀至姬路、播州赤穗及上郡地圖範圍&lt;/title&gt;
      &lt;desc id=&quot;tf-map-desc&quot;&gt;以官方鐵路及車站座標配合真實海岸與琵琶湖，按公尺投影計算 1:1 斜向長方形。包括湖西線及米原兩個方向；舊正方形與斜長方形是歷史對照，並非 1:1。新圖未在遊戲測試。&lt;/desc&gt;
    &lt;/svg&gt;
  &lt;/div&gt;
  &lt;div class=&quot;advanced-note text-small&quot; id=&quot;tf-advanced-note&quot; hidden&gt;按程式嘅高度圖像素檢查推算；尚未通過遊戲生成或載入測試。&lt;/div&gt;
  &lt;div class=&quot;coverage-caption text-small text-muted&quot; id=&quot;tf-coverage-caption&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;text-small text-muted&quot;&gt;RAM 估算：按作者地形生成約 2.5 MB/km²，加遊戲約 4 GB；屬生成時峰值粗估，實際隨城鎮、車輛、模組及遊戲版本而變，未經實測。&lt;/div&gt;

  &lt;div class=&quot;text-small text-muted&quot;&gt;路線範圍參考：&lt;a href=&quot;https://www.jr-odekake.net/station/pdf/ubn.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;JR 西日本官方路線圖&lt;/a&gt;。實際遊戲長闊需再核對，插件設定不同可能令尺寸縮小。&lt;/div&gt;

20496445647],&quot;footprint&quot;:{&quot;type&quot;:&quot;Feature&quot;,&quot;properties&quot;:{},&quot;geometry&quot;:{&quot;type&quot;:&quot;Polygon&quot;,&quot;coordinates&quot;:[[[135.69871480263063,35.86120496445647],[136.30755715545178,35.32789997013493],[135.01796157634053,34.32962281866396],[134.40842621770227,34.85652358837538],[135.69871480263063,35.86120496445647]]]}},&quot;gameKmX&quot;:80.896,&quot;gameKmY&quot;:161.792,&quot;realKmApprox&quot;:[80.896,161.792],&quot;areaMultiple&quot;:21.67013888888889,&quot;ramTerrainGB&quot;:31.95392,&quot;ramBaseGB&quot;:4,&quot;ramTotalGB&quot;:35.95392,&quot;includedCities&quot;:[&quot;大津&quot;,&quot;舞鶴&quot;,&quot;神戶&quot;,&quot;京都&quot;]}]}&lt;/script&gt;
  &lt;script src=&quot;https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js&quot;&gt;&lt;/script&gt;
  &lt;script&gt;
  (() =&gt; {
    const root = document.getElementById(&#x27;tf-kansai-coverage&#x27;);
    const data = JSON.parse(root.querySelector(&#x27;#tf-coverage-data&#x27;).textContent);
    const select = root.querySelector(&#x27;#tf-coverage-size&#x27;);
    const holder = root.querySelector(&#x27;.map-holder&#x27;);
    const svg = d3.select(root.querySelector(&#x27;.coverage-map&#x27;));
    const saved = window.openai?.widgetState?.modelContent;
    if (saved?.size &amp;&amp; data.options.some(o =&gt; o.id === saved.size)) select.value = saved.size;
    const oldBounds = data.old.bounds_wsen;
    const aliases = {&#x27;姫路&#x27;:&#x27;姬路&#x27;,&#x27;神戸&#x27;:&#x27;神戶&#x27;,&#x27;播州赤穂&#x27;:&#x27;播州赤穗&#x27;,&#x27;長浜&#x27;:&#x27;長濱&#x27;,&#x27;彦根&#x27;:&#x27;彥根&#x27;,&#x27;近江塩津&#x27;:&#x27;近江鹽津&#x27;,&#x27;三ノ宮&#x27;:&#x27;三之宮&#x27;};
    const priority = [&#x27;敦賀&#x27;,&#x27;姬路&#x27;,&#x27;播州赤穗&#x27;,&#x27;上郡&#x27;,&#x27;京都&#x27;,&#x27;大阪&#x27;,&#x27;神戶&#x27;,&#x27;米原&#x27;,&#x27;近江鹽津&#x27;,&#x27;近江今津&#x27;,&#x27;長濱&#x27;,&#x27;相生&#x27;,&#x27;網干&#x27;,&#x27;西明石&#x27;,&#x27;草津&#x27;,&#x27;大津&#x27;,&#x27;山科&#x27;,&#x27;新大阪&#x27;,&#x27;高槻&#x27;,&#x27;加古川&#x27;,&#x27;明石&#x27;,&#x27;彥根&#x27;,&#x27;三之宮&#x27;,&#x27;尼崎&#x27;,&#x27;堅田&#x27;,&#x27;舞鶴&#x27;,&#x27;名古屋&#x27;,&#x27;岡山&#x27;,&#x27;鳥取&#x27;,&#x27;福井&#x27;,&#x27;高松&#x27;,&#x27;德島&#x27;,&#x27;和歌山&#x27;,&#x27;岐阜&#x27;,&#x27;津&#x27;];
    const stationCities = data.rail.stations.features.map(f=&gt;({...f,properties:{...f.properties,name:aliases[f.properties.name]||f.properties.name,station:true}}));
    const stationNames = new Set(stationCities.map(f=&gt;f.properties.name));
    const polygon = b =&gt; ({type:&#x27;Feature&#x27;,properties:{},geometry:{type:&#x27;Polygon&#x27;,coordinates:[[[b[0],b[1]],[b[0],b[3]],[b[2],b[3]],[b[2],b[1]],[b[0],b[1]]]]}});
    const inside = (p,b) =&gt; p[0]&gt;=b[0] &amp;&amp; p[0]&lt;=b[2] &amp;&amp; p[1]&gt;=b[1] &amp;&amp; p[1]&lt;=b[3];
    const overlap = (a,b) =&gt; a.x &lt; b.x+b.width+4 &amp;&amp; a.x+a.width+4 &gt; b.x &amp;&amp; a.y &lt; b.y+b.height+4 &amp;&amp; a.y+a.height+4 &gt; b.y;
    function draw() {
      const selected = data.options.find(o =&gt; o.id === select.value) || data.options[0];
      const width = Math.max(280, Math.round(holder.getBoundingClientRect().width));
      const height = Math.round(Math.max(420, width * 1.04));
      const b = selected.bounds;
      const dx = b[2]-b[0], dy = b[3]-b[1];
      const view = [b[0]-dx*.20, b[1]-dy*.10, b[2]+dx*.20, b[3]+dy*.10];
      const projection = d3.geoMercator().fitExtent([[12,14],[width-12,height-15]], {
        type:&#x27;MultiPoint&#x27;,coordinates:[[view[0],view[1]],[view[2],view[3]]]
      });
      const path = d3.geoPath(projection);
      svg.attr(&#x27;viewBox&#x27;, `0 0 ${width} ${height}`).attr(&#x27;width&#x27;,width).attr(&#x27;height&#x27;,height);
      svg.selectAll(&#x27;g,defs,rect&#x27;).remove();
      svg.append(&#x27;defs&#x27;).append(&#x27;clipPath&#x27;).attr(&#x27;id&#x27;,&#x27;tf-map-clip&#x27;).append(&#x27;rect&#x27;).attr(&#x27;width&#x27;,width).attr(&#x27;height&#x27;,height);
      const map = svg.append(&#x27;g&#x27;).attr(&#x27;clip-path&#x27;,&#x27;url(#tf-map-clip)&#x27;);
      map.append(&#x27;rect&#x27;).attr(&#x27;width&#x27;,width).attr(&#x27;height&#x27;,height).attr(&#x27;fill&#x27;,&#x27;var(--muted)&#x27;).attr(&#x27;fill-opacity&#x27;,.35);
      map.append(&#x27;path&#x27;).datum(data.layers.land).attr(&#x27;d&#x27;,path).attr(&#x27;fill&#x27;,&#x27;var(--background)&#x27;).attr(&#x27;stroke&#x27;,&#x27;var(--border)&#x27;).attr(&#x27;stroke-width&#x27;,1);
      map.append(&#x27;path&#x27;).datum(data.layers.provinces).attr(&#x27;d&#x27;,path).attr(&#x27;fill&#x27;,&#x27;none&#x27;).attr(&#x27;stroke&#x27;,&#x27;var(--border)&#x27;).attr(&#x27;stroke-width&#x27;,.8);
      map.append(&#x27;path&#x27;).datum(data.layers.rivers).attr(&#x27;d&#x27;,path).attr(&#x27;fill&#x27;,&#x27;none&#x27;).attr(&#x27;stroke&#x27;,&#x27;var(--viz-series-4)&#x27;).attr(&#x27;stroke-opacity&#x27;,.35).attr(&#x27;stroke-width&#x27;,.8);
      map.append(&#x27;path&#x27;).datum(data.layers.lakes).attr(&#x27;d&#x27;,path).attr(&#x27;fill&#x27;,&#x27;var(--viz-series-4)&#x27;).attr(&#x27;fill-opacity&#x27;,.35).attr(&#x27;stroke&#x27;,&#x27;var(--viz-series-4)&#x27;).attr(&#x27;stroke-opacity&#x27;,.6).attr(&#x27;stroke-width&#x27;,.7);
      map.append(&#x27;path&#x27;).datum(data.rail.railFull).attr(&#x27;d&#x27;,path).attr(&#x27;fill&#x27;,&#x27;none&#x27;).attr(&#x27;stroke&#x27;,&#x27;var(--muted-foreground)&#x27;).attr(&#x27;stroke-opacity&#x27;,.5).attr(&#x27;stroke-width&#x27;,1.5);
      map.append(&#x27;path&#x27;).datum(selected.target===&#x27;himeji&#x27;?data.rail.railHimeji:data.rail.railFull).attr(&#x27;d&#x27;,path).attr(&#x27;fill&#x27;,&#x27;none&#x27;).attr(&#x27;stroke&#x27;,&#x27;var(--foreground)&#x27;).attr(&#x27;stroke-width&#x27;,1.8).attr(&#x27;stroke-linejoin&#x27;,&#x27;round&#x27;);
      map.append(&#x27;path&#x27;).datum(selected.footprint).attr(&#x27;d&#x27;,path).attr(&#x27;fill&#x27;,&#x27;var(--viz-series-1)&#x27;).attr(&#x27;fill-opacity&#x27;,.055).attr(&#x27;stroke&#x27;,&#x27;var(--viz-series-1)&#x27;).attr(&#x27;stroke-width&#x27;,2.3).attr(&#x27;stroke-dasharray&#x27;,selected.coversRailGeometry?null:&#x27;8 4&#x27;).attr(&#x27;data-selected-footprint&#x27;,selected.id);
      if (selected.id !== &#x27;friend-112-ratio-1-2&#x27;) {
        map.append(&#x27;path&#x27;).datum(data.options[0].footprint).attr(&#x27;d&#x27;,path).attr(&#x27;fill&#x27;,&#x27;none&#x27;).attr(&#x27;stroke&#x27;,&#x27;var(--viz-series-2)&#x27;).attr(&#x27;stroke-width&#x27;,1.7).attr(&#x27;stroke-dasharray&#x27;,&#x27;6 4&#x27;);
      }
      map.append(&#x27;path&#x27;).datum(polygon(oldBounds)).attr(&#x27;d&#x27;,path).attr(&#x27;fill&#x27;,&#x27;none&#x27;).attr(&#x27;stroke&#x27;,&#x27;var(--viz-series-3)&#x27;).attr(&#x27;stroke-width&#x27;,2).attr(&#x27;stroke-dasharray&#x27;,&#x27;2 3&#x27;);
      map.append(&#x27;path&#x27;).datum({type:&#x27;Polygon&#x27;,coordinates:[[...data.oldRectangle.corners,data.oldRectangle.corners[0]]]}).attr(&#x27;d&#x27;,path).attr(&#x27;fill&#x27;,&#x27;none&#x27;).attr(&#x27;stroke&#x27;,&#x27;var(--viz-series-5)&#x27;).attr(&#x27;stroke-width&#x27;,1.7).attr(&#x27;stroke-dasharray&#x27;,&#x27;5 3&#x27;);
      const labels = svg.append(&#x27;g&#x27;);
      const reserved = [{x:width-50,y:0,width:50,height:36},{x:12,y:height-42,width:126,height:42}];
      const lake = data.layers.lakes.features.find(f =&gt; f.properties.name === &#x27;Biwa Ko&#x27;);
      if (lake) {
        const c = projection(d3.geoCentroid(lake));
        if (inside(d3.geoCentroid(lake),view)) {
          const text = labels.append(&#x27;text&#x27;).attr(&#x27;class&#x27;,&#x27;map-label&#x27;).attr(&#x27;x&#x27;,c[0]).attr(&#x27;y&#x27;,c[1]-5).attr(&#x27;text-anchor&#x27;,&#x27;middle&#x27;).text(&#x27;琵琶湖&#x27;);
          const bb = text.node().getBBox();
          reserved.push({x:bb.x,y:bb.y,width:bb.width,height:bb.height});
        }
      }
      const cities = [...stationCities,...data.cities.features.filter(f=&gt;!stationNames.has(f.properties.name))].sort((a,b) =&gt; (priority.indexOf(a.properties.name)&lt;0?99:priority.indexOf(a.properties.name))-(priority.indexOf(b.properties.name)&lt;0?99:priority.indexOf(b.properties.name)));
      const candidate = [[7,-7,&#x27;start&#x27;],[-7,-7,&#x27;end&#x27;],[7,15,&#x27;start&#x27;],[-7,15,&#x27;end&#x27;],[0,-12,&#x27;middle&#x27;],[0,22,&#x27;middle&#x27;]];
      const labelLimit = width &lt; 400 ? 16 : 30;
      let count = 0;
      cities.forEach(city =&gt; {
        const p = city.geometry.coordinates;
        const pos = projection(p);
        if (pos[0]&lt;5 || pos[0]&gt;width-5 || pos[1]&lt;5 || pos[1]&gt;height-5) return;
        const included = d3.geoContains(selected.footprint,p);
        map.append(&#x27;circle&#x27;).attr(&#x27;cx&#x27;,pos[0]).attr(&#x27;cy&#x27;,pos[1]).attr(&#x27;r&#x27;,included?2.6:2.1).attr(&#x27;fill&#x27;,included?&#x27;var(--foreground)&#x27;:&#x27;var(--muted-foreground)&#x27;).attr(&#x27;data-tooltip&#x27;,city.properties.name + (included?&#x27; · 所選範圍內&#x27;:&#x27; · 所選範圍外&#x27;));
        if (count &gt;= labelLimit) return;
        const text = labels.append(&#x27;text&#x27;).attr(&#x27;class&#x27;,&#x27;map-label&#x27;).text(city.properties.name);
        let placed = false;
        for (const [ox,oy,anchor] of candidate) {
          text.attr(&#x27;x&#x27;,pos[0]+ox).attr(&#x27;y&#x27;,pos[1]+oy).attr(&#x27;text-anchor&#x27;,anchor);
          const bb = text.node().getBBox();
          if (bb.x&gt;=5 &amp;&amp; bb.y&gt;=5 &amp;&amp; bb.x+bb.width&lt;=width-5 &amp;&amp; bb.y+bb.height&lt;=height-5 &amp;&amp; !reserved.some(r=&gt;overlap(bb,r))) {
            reserved.push({x:bb.x,y:bb.y,width:bb.width,height:bb.height});
            placed = true;
            count++;
            break;
          }
        }
        if (!placed) text.remove();
      });
      labels.append(&#x27;text&#x27;).attr(&#x27;x&#x27;,width-17).attr(&#x27;y&#x27;,21).attr(&#x27;text-anchor&#x27;,&#x27;end&#x27;).text(&#x27;北 ↑&#x27;);
      const scaleKm = 50;
      const centerLat = selected.center[1];
      const distancePerDegree = d3.geoDistance([selected.center[0],centerLat],[selected.center[0]+1,centerLat])*6371.0088;
      const scalePixels = Math.abs(projection([selected.center[0]+scaleKm/distancePerDegree,centerLat])[0]-projection(selected.center)[0]);
      const scale = labels.append(&#x27;g&#x27;).attr(&#x27;transform&#x27;,`translate(16,${height-20})`);
      scale.append(&#x27;path&#x27;).attr(&#x27;d&#x27;,`M0,-5V0H${scalePixels}V-5`).attr(&#x27;stroke&#x27;,&#x27;var(--foreground)&#x27;).attr(&#x27;fill&#x27;,&#x27;none&#x27;).attr(&#x27;stroke-width&#x27;,1.3);
      scale.append(&#x27;text&#x27;).attr(&#x27;x&#x27;,0).attr(&#x27;y&#x27;,-10).attr(&#x27;class&#x27;,&#x27;map-label&#x27;).text(`現實 ${scaleKm} km`);
      root.querySelector(&#x27;#tf-coverage-dimensions&#x27;).textContent = `遊戲實際尺寸 ${selected.gameKmX.toFixed(3)} × ${selected.gameKmY.toFixed(3)} km`;
      root.querySelector(&#x27;#tf-coverage-real&#x27;).textContent = &#x27;水平比例：1:1&#x27;;
      root.querySelector(&#x27;#tf-coverage-angle&#x27;).textContent = `斜向：約北偏東 ${Math.round(selected.azimuthDeg)}°`;
      root.querySelector(&#x27;#tf-coverage-ram&#x27;).textContent = `生成時 RAM 粗估：約 ${Math.round(selected.ramTotalGB)} GB`;
      root.querySelector(&#x27;#tf-route-coverage&#x27;).textContent = selected.coversRailGeometry ? `地理範圍計算：${selected.target===&#x27;himeji&#x27;?&#x27;敦賀至姬路，含湖西線／米原兩邊&#x27;:&#x27;連相生、播州赤穗、上郡&#x27;}線路全在框內；最近邊緣約 ${selected.minimumRailClearanceKm.toFixed(1)} km。` : &#x27;地理範圍計算：112 級無法同時放入敦賀及完整西端；可選至姬路方案，或增大至 128 級。&#x27;;
      root.querySelector(&#x27;#tf-coverage-caption&#x27;).textContent = &#x27;新圖為公尺投影計算嘅 1:1 斜長方形；舊圖框只作歷史對照。尚未生成高度圖或入遊戲實測。&#x27;;
      root.querySelector(&#x27;#tf-coverage-new-name&#x27;).textContent = selected.kind;
      root.querySelector(&#x27;#tf-starter-legend&#x27;).hidden = selected.id === &#x27;friend-112-ratio-1-2&#x27;;
      root.querySelector(&#x27;#tf-advanced-note&#x27;).hidden = true;
      svg.attr(&#x27;data-rendered-size&#x27;,selected.id).attr(&#x27;data-label-count&#x27;,count);
    }
    select.addEventListener(&#x27;change&#x27;, () =&gt; {
      draw();
      window.openai?.setWidgetState?.({modelContent:{size:select.value,scaleReference:&#x27;true-1-to-1&#x27;},privateContent:null}).catch(()=&gt;{});
    });
    window.addEventListener(&#x27;openai:set_globals&#x27;, event =&gt; {
      const value = event.detail?.globals?.widgetState?.modelContent?.size;
      if (value &amp;&amp; data.options.some(o=&gt;o.id===value)) { select.value = value; draw(); }
    });
    new ResizeObserver(draw).observe(holder);
    draw();
  })();
  &lt;/script&gt;

&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${

    statePersistence: storage == null ? "none" : "local",
  };

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "widget-state-write") {
      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }
      let ok = false;
      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height !== "number" ||
        !Number.isFinite(height) ||
        height < 0
      ) {
        return;
      }
      if (height <= 10_000) {
        const width = isShare && storage != null ? frame.clientWidth : null;
        frame.style.height = Math.ceil(height) + "px";
        if (isShare && storage != null) {
          const size = JSON.stringify({
            fingerprint: sizeFingerprint,
            width,
            viewportHeight: globalThis.innerHeight,
            dark: globalThis.matchMedia("(prefers-color-scheme: dark)").matches,
            scale: globalThis.devicePixelRatio,
            height: Math.ceil(height),
          });
          if (size !== lastSize) {
            lastSize = size;
            pendingSize = size;
            globalThis.clearTimeout(sizeWriteTimeout);
            sizeWriteTimeout = globalThis.setTimeout(persistSize, 100);
          }
        }
      }
      if (isShare) {
        // Keep unusually tall content accessible without accepting an unbounded height.
        if (height > 10_000 && Number.parseFloat(frame.style.height) === 0) {
          frame.style.removeProperty("height");
        }
        frame.scrolling = height > 10_000 ? "auto" : "no";
        document.documentElement.classList.add("visualization-share-ready");
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!isShare && (!Number.isFinite(height) || height <= viewportHeight)) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  const frameHtml = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  if (isShare && storage != null) {
    // Fingerprint the rendered document, including restored widget state, without
    // storing its content. This is a layout cache, not a security identity.
    let hash = 5381;
    for (let index = 0; index < frameHtml.length; index += 1) {
      hash = (hash * 33 + frameHtml.charCodeAt(index)) % 4_294_967_296;
    }
    sizeFingerprint = hash.toString(36);
    try {
      const size = JSON.parse(storage.getItem(sizeStorageKey) ?? "null");
      if (
        size?.fingerprint === sizeFingerprint &&
        size.width === frame.clientWidth &&
        size.viewportHeight === globalThis.innerHeight &&
        size.dark ===
          globalThis.matchMedia("(prefers-color-scheme: dark)").matches &&
        size.scale === globalThis.devicePixelRatio &&
        typeof size.height === "number" &&
        Number.isFinite(size.height) &&
        size.height >= 0 &&
        size.height <= 10_000
      ) {
        frame.style.height = size.height + "px";
      }
    } catch {
      // Ignore missing or invalid cache entries and measure the live frame.
    }
  }
  frame.srcdoc = frameHtml;
  delete frame.dataset.srcdoc;
})();
</script>
